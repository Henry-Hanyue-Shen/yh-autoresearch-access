# YH Autoresearch — isolated code-gated release route.
location = /release/yh-autoresearch {
    return 308 /release/yh-autoresearch/;
}

location ^~ /release/yh-autoresearch/ {
    proxy_pass http://127.0.0.1:18788/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /release/yh-autoresearch;
    proxy_connect_timeout 3s;
    proxy_read_timeout 120s;
    client_max_body_size 16k;

    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'none'" always;
}
